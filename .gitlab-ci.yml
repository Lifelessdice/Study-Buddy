image: node:22-alpine

# Cache modules in between jobs per-branch
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - server/node_modules/

stages:
  - build
  - test
  - postman-test
  - deploy

build:
  stage: build
  tags:
    - docker
  script:
    - cd server
    - npm install

postman-test:
  stage: test
  tags:
    - docker
  image: node:22-alpine
  services:
    - name: mongo:latest
      alias: mongo
  variables:
    MONGODB_URI: "mongodb://mongo:27017/serverTestDB"
  before_script:
    - cd server
    - npm install
  script:
    - npm run ci-test
  artifacts:
    when: always
    reports:
      junit: newman-results.xml
    paths:
      - newman-results.xml

deploy:
  stage: deploy
  tags:
    - docker
  image: ruby:alpine
  script:
    - apk update && apk add git curl
    - gem install dpl
    - dpl --provider=heroku --app=$HEROKU_APP_NAME --api-key=$HEROKU_API_KEY
  environment:
    name: production
    url: https://$HEROKU_APP_NAME.herokuapp.com/
  only:
    refs:
      - master
    variables:
      - $HEROKU_APP_NAME
      - $HEROKU_API_KEY
